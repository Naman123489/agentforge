[project]
name = "agentforge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["openai>=1.40", "pydantic>=2.6", "pyyaml>=6", "openapi-spec-validator>=0.7,<1.0", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "fastapi", "httpx", "uvicorn", "ruff", "jsonschema", "bandit>=1.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
