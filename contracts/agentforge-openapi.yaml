openapi: 3.1.0
info:
  title: AgentForge Control Plane API
  version: 1.0.0
  summary: Shared API contract for the AgentForge multi-agent coding platform.
  description: |
    Contract for the AgentForge platform itself (dashboard, orchestration, agents,
    reviewer, checkpoints, model router, and optional deployment). This is NOT the
    generated application's API contract. The Planner creates a separate OpenAPI
    contract inside each run for the application being built.
servers:
  - url: http://localhost:8000/api/v1
    description: Local development
  - url: https://{host}/api/v1
    description: Deployed environment
    variables:
      host:
        default: agentforge.example.com
security:
  - bearerAuth: []
tags:
  - name: Health
  - name: Runs
  - name: Stages
  - name: Events
  - name: Contracts
  - name: Files
  - name: Checkpoints
  - name: Review
  - name: Models
  - name: Usage
  - name: Preview
  - name: Deployments
paths:
  /health:
    get:
      tags: [Health]
      security: []
      operationId: getHealth
      summary: Check API health
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthResponse'}
  /runs:
    post:
      tags: [Runs]
      operationId: createRun
      summary: Create and start an AgentForge run
      description: Accepts a user request and queues the Planner stage. Returns immediately with a run ID.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRunRequest'}
      responses:
        '202':
          description: Run accepted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
    get:
      tags: [Runs]
      operationId: listRuns
      summary: List runs visible to the current user
      parameters:
        - in: query
          name: status
          schema: {$ref: '#/components/schemas/RunStatus'}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - in: query
          name: cursor
          schema: {type: string}
      responses:
        '200':
          description: Paginated runs.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunList'}
  /runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      operationId: getRun
      summary: Get run status, stages, and aggregate usage
      responses:
        '200':
          description: Run details.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunDetail'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Runs]
      operationId: cancelRun
      summary: Request cancellation of a run
      description: Cancellation is cooperative; already submitted provider calls may still finish.
      responses:
        '202':
          description: Cancellation requested.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActionAccepted'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /runs/{runId}/followups:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Runs]
      operationId: createFollowup
      summary: Start a new iteration from the latest approved checkpoint
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FollowupRequest'}
      responses:
        '202':
          description: Follow-up accepted as a new run.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunDetail'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /runs/{runId}/events:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Events]
      operationId: streamRunEvents
      summary: Stream run events using Server-Sent Events
      description: |
        Response is text/event-stream. Each event's data field is a JSON-serialized
        RunEvent. Clients should reconnect using Last-Event-ID where supported.
      parameters:
        - in: header
          name: Last-Event-ID
          required: false
          schema: {type: string}
      responses:
        '200':
          description: SSE stream.
          content:
            text/event-stream:
              schema: {type: string, description: 'SSE frames: id, event, data; data is RunEvent JSON.'}
        '404': {$ref: '#/components/responses/NotFound'}
  /runs/{runId}/stages:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Stages]
      operationId: listStages
      summary: List stages for a run
      responses:
        '200':
          description: Ordered stage list.
          content:
            application/json:
              schema:
                type: object
                required: [run_id, stages]
                properties:
                  run_id: {type: string}
                  stages:
                    type: array
                    items: {$ref: '#/components/schemas/Stage'}
        '404': {$ref: '#/components/responses/NotFound'}
  /runs/{runId}/contracts:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Contracts]
      operationId: getRunContract
      summary: Get the generated application OpenAPI contract
      responses:
        '200':
          description: Contract document and validation state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContractArtifact'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Contracts]
      operationId: putRunContract
      summary: Save or replace the application contract before build starts
      description: Contract changes after build begins must use the ContractChangeRequest workflow.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutContractRequest'}
      responses:
        '200':
          description: Contract saved and validated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContractArtifact'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /runs/{runId}/files:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Files]
      operationId: listRunFiles
      summary: Get generated project file tree
      parameters:
        - in: query
          name: path
          description: Optional directory path relative to the run workspace.
          schema: {type: string, default: ''}
      responses:
        '200':
          description: File tree.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileTreeResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
  /runs/{runId}/files/content:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Files]
      operationId: getRunFileContent
      summary: Read a generated text file
      parameters:
        - in: query
          name: path
          required: true
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: File content.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileContent'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /runs/{runId}/download:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Files]
      operationId: downloadRunZip
      summary: Download generated project as a ZIP archive
      responses:
        '200':
          description: Project archive.
          content:
            application/zip:
              schema: {type: string, format: binary}
        '404': {$ref: '#/components/responses/NotFound'}
  /runs/{runId}/checkpoints:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Checkpoints]
      operationId: listCheckpoints
      summary: List approved restore points
      responses:
        '200':
          description: Checkpoint history.
          content:
            application/json:
              schema:
                type: object
                required: [run_id, checkpoints]
                properties:
                  run_id: {type: string}
                  checkpoints:
                    type: array
                    items: {$ref: '#/components/schemas/Checkpoint'}
        '404': {$ref: '#/components/responses/NotFound'}
  /runs/{runId}/rollback:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Checkpoints]
      operationId: rollbackRun
      summary: Restore a run workspace to an approved checkpoint
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RollbackRequest'}
      responses:
        '202':
          description: Rollback accepted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActionAccepted'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /runs/{runId}/review:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Review]
      operationId: getLatestReview
      summary: Get the latest executable review report
      responses:
        '200':
          description: Review report.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewReport'}
        '404': {$ref: '#/components/responses/NotFound'}
  /runs/{runId}/stages/{stageId}/contract-change-requests:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - $ref: '#/components/parameters/StageId'
    post:
      tags: [Contracts]
      operationId: submitContractChangeRequest
      summary: Submit a proposed contract change when a builder cannot safely follow the contract
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ContractChangeRequest'}
      responses:
        '201':
          description: Change request recorded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ContractChangeRecord'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /runs/{runId}/usage:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Usage]
      operationId: getRunUsage
      summary: Get token and cost usage for the run
      responses:
        '200':
          description: Usage summary.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsageSummary'}
        '404': {$ref: '#/components/responses/NotFound'}
  /models:
    get:
      tags: [Models]
      operationId: listConfiguredModels
      summary: List configured model slots and their availability
      responses:
        '200':
          description: Model configuration summary. Secrets and provider credentials are never returned.
          content:
            application/json:
              schema:
                type: object
                required: [models]
                properties:
                  models:
                    type: array
                    items: {$ref: '#/components/schemas/ModelStatus'}
  /runs/{runId}/preview:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Preview]
      operationId: getRunPreview
      summary: Get the generated app preview status and URL
      responses:
        '200':
          description: Preview information.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PreviewInfo'}
        '404': {$ref: '#/components/responses/NotFound'}
  /runs/{runId}/deployments:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Deployments]
      operationId: createDeployment
      summary: Request optional deployment of an approved build
      description: >-
        Publishes the run's FINAL Reviewer-approved checkpoint (its annotated stage-{id}-green tag) and, for a live
        target, deploys and health-checks it. Disabled unless the server has deployment configured (see
        dependencies.deploy in /health). 409 explains why a request cannot run: run not finished, final stage not
        approved, deployment not configured, target unavailable, or a deployment already in progress.
        Target `github` (added 2026-10-30) publishes to a private GitHub repository without a live deployment.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeploymentRequest'}
      responses:
        '202':
          description: Deployment accepted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeploymentStatus'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /runs/{runId}/deployments/latest:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Deployments]
      operationId: getLatestDeployment
      summary: Get latest deployment status
      responses:
        '200':
          description: Deployment status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeploymentStatus'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RunId:
      in: path
      name: runId
      required: true
      schema: {type: string, minLength: 1}
    StageId:
      in: path
      name: stageId
      required: true
      schema: {type: string, minLength: 1}
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      description: Client-generated key to avoid duplicate run creation on retry.
      schema: {type: string, minLength: 8, maxLength: 128}
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: Request conflicts with the current run state.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    ValidationError:
      description: Request schema validation failed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ValidationErrorResponse'}
    RateLimited:
      description: Rate limit or concurrency limit reached.
      headers:
        Retry-After:
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status: {type: string, enum: [ok, degraded]}
        version: {type: string, example: '1.0.0'}
        dependencies:
          type: object
          additionalProperties: {type: string, enum: [ok, degraded, unavailable]}
    CreateRunRequest:
      type: object
      required: [prompt]
      additionalProperties: false
      properties:
        prompt: {type: string, minLength: 5, maxLength: 20000, example: 'Build an arcade website with Snake, 2048, and Memory Match.'}
        project_name: {type: string, minLength: 1, maxLength: 100, example: arcade}
        examples: {type: array, items: {type: string}, maxItems: 10}
        budget:
          $ref: '#/components/schemas/RunBudget'
        options:
          $ref: '#/components/schemas/RunOptions'
    FollowupRequest:
      type: object
      required: [prompt]
      additionalProperties: false
      properties:
        prompt: {type: string, minLength: 3, maxLength: 20000, example: 'Add Tic-Tac-Toe and a difficulty selector.'}
        from_checkpoint_id: {type: string, description: Defaults to latest approved checkpoint.}
        budget: {$ref: '#/components/schemas/RunBudget'}
    RunBudget:
      type: object
      additionalProperties: false
      properties:
        max_tokens: {type: integer, minimum: 1, maximum: 5000000, default: 200000}
        max_cost_usd: {type: number, minimum: 0, maximum: 1000, default: 2}
        max_premium_cost_usd: {type: number, minimum: 0, maximum: 1000, default: 1}
        max_wall_time_seconds: {type: integer, minimum: 30, maximum: 86400, default: 1800}
        max_retries_per_stage: {type: integer, minimum: 0, maximum: 10, default: 3}
    RunOptions:
      type: object
      additionalProperties: false
      properties:
        enable_deploy_agent: {type: boolean, default: false}
        enable_preview: {type: boolean, default: true}
        run_e2e_tests: {type: boolean, default: true}
        visibility: {type: string, enum: [private, team], default: private}
    RunStatus:
      type: string
      enum: [created, planning, contract, building, verifying, checkpointing, rolling_back, done, failed, cancelled, stopped]
    StageStatus:
      type: string
      enum: [pending, running, passed, failed, rolled_back, skipped, stopped]
    AgentRole:
      type: string
      enum: [planner, backend, frontend, reviewer, deploy]
    RunDetail:
      type: object
      required: [id, status, prompt, created_at, stages, usage]
      properties:
        id: {type: string, example: run_01J9ABCDEF}
        status: {$ref: '#/components/schemas/RunStatus'}
        prompt: {type: string}
        project_name: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        current_stage_id: {type: [string, 'null']}
        stages: {type: array, items: {$ref: '#/components/schemas/Stage'}}
        latest_checkpoint_id: {type: [string, 'null']}
        usage: {$ref: '#/components/schemas/UsageSummary'}
        error: {oneOf: [{$ref: '#/components/schemas/ErrorResponse'}, {type: 'null'}]}
    RunList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/RunDetail'}}
        next_cursor: {type: [string, 'null']}
    Stage:
      type: object
      required: [id, run_id, name, agent, status, attempt]
      properties:
        id: {type: string}
        run_id: {type: string}
        name: {type: string, example: backend_build}
        agent: {$ref: '#/components/schemas/AgentRole'}
        status: {$ref: '#/components/schemas/StageStatus'}
        attempt: {type: integer, minimum: 1}
        max_attempts: {type: integer, minimum: 1}
        started_at: {type: [string, 'null'], format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        depends_on: {type: array, items: {type: string}}
        files_allowed: {type: array, items: {type: string}}
        result: {oneOf: [{$ref: '#/components/schemas/BuildResult'}, {type: 'null'}]}
        review: {oneOf: [{$ref: '#/components/schemas/ReviewReport'}, {type: 'null'}]}
    RunEvent:
      type: object
      required: [id, run_id, type, timestamp, data]
      properties:
        id: {type: string}
        run_id: {type: string}
        stage_id: {type: [string, 'null']}
        type:
          type: string
          enum: [run_created, run_status_changed, stage_started, stage_progress, stage_finished, agent_message, route_decision, model_call_started, model_call_ok, model_call_failed, budget_warning, budget_exhausted, review_started, review_finished, checkpoint_created, rollback_started, rollback_finished, contract_change_requested, preview_ready, deployment_status, run_finished, error]
        timestamp: {type: string, format: date-time}
        data: {type: object, additionalProperties: true}
    TaskAssignment:
      type: object
      required: [stage_id, agent, instructions]
      properties:
        stage_id: {type: string}
        agent: {$ref: '#/components/schemas/AgentRole'}
        instructions: {type: string, minLength: 1}
        contract_ref: {type: [string, 'null'], example: contract/openapi.yaml}
        files_allowed: {type: array, items: {type: string}}
        failed_attempts: {type: integer, minimum: 0, default: 0}
        reviewer_failures: {type: array, items: {type: string}}
        budget_context: {type: object, additionalProperties: true}
    BuildResult:
      type: object
      required: [stage_id, status, files_changed, checks, models_used, tokens, cost_usd, iterations, notes]
      properties:
        stage_id: {type: string}
        status: {type: string, enum: [done, failed, contract_change_requested, stopped]}
        files_changed: {type: array, items: {type: string}}
        checks: {type: array, items: {$ref: '#/components/schemas/CheckResult'}}
        models_used: {type: array, items: {type: string}}
        tokens: {type: integer, minimum: 0}
        cost_usd: {type: number, minimum: 0}
        iterations: {type: integer, minimum: 0}
        notes: {type: array, items: {type: string}}
    CheckResult:
      type: object
      required: [name, passed]
      properties:
        name: {type: string, example: pytest}
        passed: {type: boolean}
        exit_code: {type: [integer, 'null']}
        duration_ms: {type: [integer, 'null'], minimum: 0}
        log: {type: string}
    ReviewReport:
      type: object
      required: [stage_id, verdict, checks, required_fixes, created_at]
      properties:
        stage_id: {type: string}
        verdict: {type: string, enum: [approve, reject, blocked]}
        checks: {type: array, items: {$ref: '#/components/schemas/CheckResult'}}
        required_fixes: {type: array, items: {type: string}}
        summary: {type: string}
        created_at: {type: string, format: date-time}
    Checkpoint:
      type: object
      required: [id, run_id, stage_id, git_tag, summary, tests_passed, created_at]
      properties:
        id: {type: string}
        run_id: {type: string}
        stage_id: {type: string}
        git_tag: {type: string}
        summary: {type: string}
        tests_passed: {type: integer, minimum: 0}
        created_at: {type: string, format: date-time}
    RollbackRequest:
      type: object
      required: [checkpoint_id]
      properties:
        checkpoint_id: {type: string}
        reason: {type: string, maxLength: 2000}
        retry_after_rollback: {type: boolean, default: false}
    ContractArtifact:
      type: object
      required: [run_id, path, openapi_version, valid]
      properties:
        run_id: {type: string}
        path: {type: string, example: contract/openapi.yaml}
        openapi_version: {type: string, example: 3.1.0}
        valid: {type: boolean}
        validation_errors: {type: array, items: {type: string}}
        content: {type: string, description: Raw YAML or JSON OpenAPI document.}
        updated_at: {type: string, format: date-time}
    PutContractRequest:
      type: object
      required: [content]
      properties:
        content: {type: string, minLength: 1}
        format: {type: string, enum: [yaml, json], default: yaml}
    ContractChangeRequest:
      type: object
      required: [problem, proposed_change, reason]
      properties:
        problem: {type: string, minLength: 1}
        proposed_change: {type: string, minLength: 1}
        reason: {type: string, minLength: 1}
        affected_paths: {type: array, items: {type: string}}
        breaking_change: {type: boolean, default: false}
    ContractChangeRecord:
      allOf:
        - $ref: '#/components/schemas/ContractChangeRequest'
        - type: object
          required: [id, run_id, stage_id, status, created_at]
          properties:
            id: {type: string}
            run_id: {type: string}
            stage_id: {type: string}
            status: {type: string, enum: [pending, accepted, rejected, applied]}
            created_at: {type: string, format: date-time}
    UsageSummary:
      type: object
      required: [input_tokens, output_tokens, total_tokens, estimated_cost_usd, confirmed_cost_usd, premium_cost_usd, by_model]
      properties:
        input_tokens: {type: integer, minimum: 0}
        output_tokens: {type: integer, minimum: 0}
        total_tokens: {type: integer, minimum: 0}
        estimated_cost_usd: {type: number, minimum: 0}
        confirmed_cost_usd: {type: [number, 'null'], minimum: 0}
        premium_cost_usd: {type: number, minimum: 0}
        free_allowance_used: {type: [integer, 'null'], minimum: 0}
        remaining_budget_usd: {type: [number, 'null'], minimum: 0}
        by_model:
          type: array
          items:
            type: object
            required: [model_id, input_tokens, output_tokens, estimated_cost_usd]
            properties:
              model_id: {type: string}
              input_tokens: {type: integer, minimum: 0}
              output_tokens: {type: integer, minimum: 0}
              estimated_cost_usd: {type: number, minimum: 0}
              calls: {type: integer, minimum: 0}
    ModelStatus:
      type: object
      required: [slot, model_id, role, enabled, health]
      properties:
        slot: {type: string, enum: [economy, coding, premium]}
        model_id: {type: string}
        role: {type: string}
        enabled: {type: boolean}
        health: {type: string, enum: [healthy, degraded, unavailable, unknown]}
        supports_tools: {type: [boolean, 'null']}
        supports_structured_output: {type: [boolean, 'null']}
        context_window: {type: [integer, 'null'], minimum: 1}
        price_status: {type: string, enum: [verified, estimated, unknown]}
    FileTreeResponse:
      type: object
      required: [run_id, root, entries]
      properties:
        run_id: {type: string}
        root: {type: string}
        entries:
          type: array
          items:
            type: object
            required: [path, kind]
            properties:
              path: {type: string}
              kind: {type: string, enum: [file, directory]}
              size_bytes: {type: integer, minimum: 0}
              modified_at: {type: string, format: date-time}
    FileContent:
      type: object
      required: [path, content, encoding]
      properties:
        path: {type: string}
        content: {type: string}
        encoding: {type: string, enum: [utf-8, base64], default: utf-8}
        truncated: {type: boolean, default: false}
    PreviewInfo:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [pending, building, ready, failed, unavailable]}
        url: {type: [string, 'null'], format: uri}
        health_check_passed: {type: [boolean, 'null']}
        error: {type: [string, 'null']}
    DeploymentRequest:
      type: object
      required: [target]
      properties:
        target: {type: string, enum: [github, nebius_serverless, configured_target]}
        health_check_path: {type: string, default: /health, pattern: '^/([^/\s][^\s]{0,198})?$'}
        rollback_on_failure: {type: boolean, default: true}
        repo_name: {type: [string, 'null'], minLength: 1, maxLength: 100, pattern: '^[A-Za-z0-9._ -]+$', description: 'GitHub repository name; default <project>-<run id>'}
        visibility: {type: string, enum: [private, public], default: private}
    DeploymentStatus:
      type: object
      required: [id, status, target, created_at]
      properties:
        id: {type: string}
        status:
          type: string
          enum: [queued, publishing, pushed, deploying, healthy, failed, rolled_back]
          description: >-
            publishing = verifying the checkpoint, scanning for secrets, pushing; pushed = published to GitHub with
            no live deployment (never reported as healthy); healthy = deployed and its health check passed.
        target: {type: string}
        url: {type: [string, 'null'], format: uri, description: Live deployment URL (not the repository)}
        health_check_passed: {type: [boolean, 'null']}
        error: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        checkpoint_id: {type: [string, 'null'], description: The approved checkpoint that was published}
        git_tag: {type: [string, 'null']}
        repo_url: {type: [string, 'null'], description: GitHub repository URL once pushed}
        commit_sha: {type: [string, 'null'], description: Commit pushed to the repository}
        source_commit: {type: [string, 'null'], description: Workspace commit the approved tag points to}
        notes: {type: array, items: {type: string}}
        checks:
          type: array
          items: {$ref: '#/components/schemas/CheckResult'}
    ActionAccepted:
      type: object
      required: [accepted, message]
      properties:
        accepted: {type: boolean, const: true}
        message: {type: string}
        operation_id: {type: [string, 'null']}
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error: {type: string, example: conflict}
        message: {type: string}
        request_id: {type: [string, 'null']}
        details: {type: object, additionalProperties: true}
    ValidationErrorResponse:
      type: object
      required: [error, message, issues]
      properties:
        error: {type: string, const: validation_error}
        message: {type: string}
        issues:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: {type: array, items: {type: [string, integer]}}
              message: {type: string}
              code: {type: string}
